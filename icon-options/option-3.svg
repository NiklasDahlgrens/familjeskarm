<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#fde8ff"/>
    </linearGradient>
    <linearGradient id="cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff1f5"/>
    </linearGradient>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg3)"/>
  <!-- peeking heads behind -->
  <g filter="url(#sh3)">
    <!-- Hubby head -->
    <circle cx="188" cy="188" r="78" fill="#22c55e"/>
    <circle cx="162" cy="176" r="10" fill="#052e16"/>
    <circle cx="204" cy="176" r="10" fill="#052e16"/>
    <path d="M170 204 q18 14 36 0" fill="none" stroke="#052e16" stroke-width="7" stroke-linecap="round"/>
    <!-- Wifey head -->
    <circle cx="324" cy="188" r="78" fill="#3b82f6"/>
    <circle cx="298" cy="176" r="10" fill="#0f172a"/>
    <circle cx="340" cy="176" r="10" fill="#0f172a"/>
    <path d="M306 204 q18 14 36 0" fill="none" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <!-- little hair tuft / bow hint for distinction -->
    <ellipse cx="324" cy="118" rx="22" ry="14" fill="#2563eb"/>
    <ellipse cx="168" cy="122" rx="18" ry="12" fill="#16a34a"/>
  </g>
  <!-- calendar / screen in front -->
  <g filter="url(#sh3)">
    <rect x="96" y="230" width="320" height="220" rx="36" fill="url(#cal)" stroke="#ec4899" stroke-width="10"/>
    <rect x="96" y="230" width="320" height="64" rx="36" fill="#ec4899"/>
    <rect x="96" y="270" width="320" height="24" fill="#ec4899"/>
    <!-- binder rings -->
    <rect x="168" y="210" width="22" height="40" rx="8" fill="#f9a8d4"/>
    <rect x="322" y="210" width="22" height="40" rx="8" fill="#f9a8d4"/>
    <!-- 2x2 grid of dots suggesting days -->
    <circle cx="176" cy="340" r="16" fill="#22c55e"/>
    <circle cx="256" cy="340" r="16" fill="#3b82f6"/>
    <circle cx="336" cy="340" r="16" fill="#ec4899"/>
    <circle cx="176" cy="400" r="16" fill="#86efac"/>
    <circle cx="256" cy="400" r="16" fill="#93c5fd"/>
    <circle cx="336" cy="400" r="16" fill="#f9a8d4"/>
  </g>
</svg>
